# Gradle / JVM 设置。
#
# 这里只放**所有机器都适用**的配置，机器专有的东西（证书、代理、私有仓库凭据）
# 一律不要写进这个文件——它是会提交进仓库的。
#
# 如果你的网络环境需要自定义信任库（例如公司代理做了 HTTPS 拦截），不要改这个
# 文件，改用下面任一方式在本机注入：
#
#   1) 命令行覆盖（优先级最高，只影响这一次构建）：
#      gradlew.bat -Dorg.gradle.jvmargs="-Xmx2048m -Dfile.encoding=UTF-8 \
#          -Djavax.net.ssl.trustStore=<你的信任库路径> \
#          -Djavax.net.ssl.trustStorePassword=<口令> \
#          -Djavax.net.ssl.trustStoreType=PKCS12" :app:assembleDebug
#
#   2) 写进 GRADLE_USER_HOME/gradle.properties（即 ~/.gradle/gradle.properties），
#      这个文件属于本机、不会被提交。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
